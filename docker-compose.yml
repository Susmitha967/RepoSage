
services:
  postgres:
    image: postgres:16
    container_name: gpai-postgres
    restart: always
    environment:
      POSTGRES_USER: gpai_user
      POSTGRES_PASSWORD: gpai_pass
      POSTGRES_DB: gpai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: gpai-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: